{% extends "admin/base_site.html" %}

{% block content %}
  <div id="content-main">
    <p>Review the request locally, then choose where to open the remote issue.</p>

    <form method="post" novalidate>
      {% csrf_token %}
      {{ form.as_p }}
      <div class="submit-row">
        <input type="submit" value="Open remote issue" class="default">
      </div>
    </form>
  </div>
{% endblock %}
